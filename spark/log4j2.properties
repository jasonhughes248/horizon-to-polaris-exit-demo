# Spark/Iceberg logging for the demo. Each step prints its own result line and checks the
# table itself, so Spark's routine noise is hidden:
#  - Iceberg's commit retries ("concurrently modified") and their best-effort cleanup
#    (s3:DeleteObject is not in Horizon's vended credentials)
#  - task-failure stack traces from the access checks, where a denied write is the
#    expected outcome; the step still reports any unexpected result
# Real failures still raise, and the step prints `step N FAILED: ...`.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

logger.native.name = org.apache.hadoop.util.NativeCodeLoader
logger.native.level = error
logger.retry.name = org.apache.iceberg.util.Tasks
logger.retry.level = off
logger.snapshot.name = org.apache.iceberg.SnapshotProducer
logger.snapshot.level = off
logger.sparkwrite.name = org.apache.iceberg.spark.source
logger.sparkwrite.level = off
logger.v2write.name = org.apache.spark.sql.execution.datasources.v2
logger.v2write.level = off
logger.executor.name = org.apache.spark.executor.Executor
logger.executor.level = off
logger.tasksets.name = org.apache.spark.scheduler.TaskSetManager
logger.tasksets.level = off
logger.abort.name = org.apache.spark.util.Utils
logger.abort.level = off
logger.s3io.name = org.apache.iceberg.aws.s3.S3FileIO
logger.s3io.level = off
